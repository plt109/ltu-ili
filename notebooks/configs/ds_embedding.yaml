save_base: ds_embedding
out_dir: "{save_base}/embedding_{embedding_flavour}_{model_type}_{hidden_features}hidden_{num_transforms}transforms"

wandb:
  project: "wandb_tutorial"
  entity: "plt109"
  group: "deepset_embedding_nsf_npe"
  tags:
    - "you_can_also_tag_from_here"

embedding:
  flavour: basic_deepset
  in_channels: 2
  output_size: 8
  hidden_layers: 2
  hidden_size: 32

model:
  type: nsf
  hidden_features: 32
  num_transforms: 2

training:
  batch_size: 32
  learning_rate: 0.0001
  stop_after_epochs: 20