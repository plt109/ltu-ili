# hybrid5_6params_config.yaml
# DeepSet (out_channels-dim) + 5 hand-crafted stats -> NSF, 6 free params
# g1, g2, ambe_nr_rate, alpha, beta, epsilon
save_base: 6_param_trained_models/deepset_sweep

wandb:
  project: my-sbi-project
  entity: plt109

data:
  base_dir: /home/puehlengt/appletree/notebooks
  fname: harvested_testsims_6params.npy
  prebuilt_fname: pyg_dataset_raw_6params.pt
  num_samples: 198000

# resume: (uncomment one block when resuming from checkpoint; omit entirely for cold start)
# hs32 hl3 (gpu0)
# resume:
#   checkpoint: 6_param_trained_models/deepset_sweep/50000totalsamples_hybrid5_deepset_nsf_h64_t5_emb_hs32_hl3_lr0.0003_ReduceLROnPlateau/checkpoint_epoch300.pt
#   epoch: 300
#   lr: 2.34e-6

# hs64 hl2 (gpu1)
# resume:
#   checkpoint: 6_param_trained_models/deepset_sweep/50000totalsamples_hybrid5_deepset_nsf_h64_t5_emb_hs64_hl2_lr0.0003_ReduceLROnPlateau/checkpoint_epoch200.pt
#   epoch: 200
#   lr: 9.37e-6

# hs64 hl3 (gpu2)
# resume:
#   checkpoint: 6_param_trained_models/deepset_sweep/50000totalsamples_hybrid5_deepset_nsf_h64_t5_emb_hs64_hl3_lr0.0003_ReduceLROnPlateau/checkpoint_epoch200.pt
#   epoch: 200
#   lr: 3.75e-5

embedding:
  in_channels: 2
  output_size: 8   # DeepSet-only dims; actual NSF input = output_size + 5
  hidden_layers: 3
  hidden_size: 64

model:
  type: nsf
  hidden_features: 64
  num_transforms: 5

hardware:
  cuda_device: 3
  num_workers: 0

training:
  batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.0
  clip_max_norm: 5
  checkpoint_every: 100
  # --- ReduceLROnPlateau ---
  lr_scheduler: ReduceLROnPlateau
  lr_decay_factor: 0.5
  lr_patience: 10
  stop_after_epochs: 30
  max_epochs: 10000
  # --- CosineAnnealingLR ---
  # lr_scheduler: CosineAnnealingLR
  # stop_after_epochs: 1500
  # max_epochs: 1500
