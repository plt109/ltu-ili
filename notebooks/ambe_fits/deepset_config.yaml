# deepset_config.yaml
save_base: 3_param_trained_models/deepset_sweep

data:
  base_dir: /home/puehlengt/appletree/notebooks
  fname: harvested_testsims_3params.npy
  num_samples: 50000

embedding:
  in_channels: 2
  output_size: 8
  hidden_layers: 2
  hidden_size: 32

model:
  type: nsf
  hidden_features: 32
  num_transforms: 3

training:
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.0
  stop_after_epochs: 30
  clip_max_norm: 5
  max_epochs: 10000
  lr_scheduler: ReduceLROnPlateau
  lr_decay_factor: 0.5
  lr_patience: 10
